name: Bug report
description: Something behaves differently from the docs or from how it worked before.
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. Please search existing issues first. **Security problems go through
        private reporting, not here.** Never paste secrets or real end-user data.
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: [SDK (in the host app), Studio (console), Backend / API, Self-hosting / Docker, Docs, Not sure]
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: The symptom, and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Create a Flow with a tooltip step targeting `#save`
        2. Publish it for https://staging.example.com
        3. Open the page as a new user
        4. The tooltip appears behind the header
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Release tag or commit of your instance.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Browser and OS
      placeholder: Chrome 140, macOS 26
  - type: textarea
    id: logs
    attributes:
      label: Logs, screenshots, `Guide.debug()` output
      render: text
