# Local emulators for development. Start with: scripts/dev-services.sh up
name: guide-dev

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: guide
      POSTGRES_PASSWORD: guide
      POSTGRES_DB: guide
    ports:
      - "${GUIDE_POSTGRES_PORT:-55432}:5432"  # not 5432, to avoid clashing with a local Postgres
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U guide -d guide"]
      interval: 5s
      timeout: 3s
      retries: 10

  mailpit:
    image: axllent/mailpit:v1.21
    ports:
      - "${GUIDE_SMTP_PORT:-1025}:1025"  # SMTP
      - "${GUIDE_MAILPIT_UI_PORT:-8025}:8025"  # web UI
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
